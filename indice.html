<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela ASCII</title>

<style>
body{font-family:Arial;background:#0f0f2e;color:#fff;margin:0}
.nav{padding:10px;background:#1a1a3e;text-align:center}
.nav button{margin:4px;padding:8px;border:none;border-radius:10px;background:#4f46e5;color:#fff;cursor:pointer}
.section{display:none;padding:20px}
.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:5px}
.cell{background:#1e1e4a;text-align:center;padding:10px;border-radius:8px;cursor:pointer}
.cell:hover{background:#2d2d6a}
textarea{width:100%;margin-top:10px}
.result{margin-top:10px;color:#00ffae}
</style>

</head>

<body>

<div class="nav">
<button onclick="show('intro')">Início</button>
<button onclick="show('tabela')">Tabela</button>
<button onclick="show('codec')">Codificador</button>
<button onclick="show('quiz')">Quiz</button>
</div>

<!-- INTRO -->
<div id="intro" class="section active">
<h1>Tabela ASCII</h1>
<p>Computadores usam números para representar letras.</p>

<p>Exemplo: A = 65</p>

<p><strong>Unicode</strong> é usado hoje para acentos e emojis.</p>

<p style="color:yellow">⚠ ASCII não tem acentos.</p>
</div>

<!-- TABELA -->
<div id="tabela" class="section">
<h1>Tabela</h1>
<div class="grid" id="grid"></div>

<p id="detail"></p>
</div>

<!-- CODEC -->
<div id="codec" class="section">
<h1>Codificador</h1>

<textarea id="txt" placeholder="Ex: Ola"></textarea>
<button onclick="encode()">Converter</button>

<div class="result" id="out"></div>
</div>

<!-- QUIZ -->
<div id="quiz" class="section">
<h1>Quiz</h1>

<p id="q"></p>
<div id="opts"></div>
<p id="fb"></p>

<button onclick="next()">Próxima</button>
</div>

<script>

// NAVEGAÇÃO
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// TABELA ASCII
let grid=document.getElementById("grid");
for(let i=32;i<127;i++){
let div=document.createElement("div");
div.className="cell";
div.innerHTML=String.fromCharCode(i)+"<br>"+i;

div.onclick=function(){
document.getElementById("detail").textContent=
"Caractere: "+String.fromCharCode(i)+" | Código: "+i;
};

grid.appendChild(div);
}

// CODIFICADOR
function encode(){
let txt=document.getElementById("txt").value;
let result=txt.split('').map(c=>c.charCodeAt(0)).join(" ");
